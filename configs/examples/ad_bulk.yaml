# AD Curated Validation Config
# 5 brain cortex datasets, curated gene seeds
# To download data: python scripts/download_data.py ad
# NOTE: 3 datasets require filtering — see docs/DATA_RECONSTRUCTION.md

condition: alzheimers_disease
seed_genes: ../../data/seeds/ad_curated_genes.csv
hgnc_path: ../../data/hgnc/hgnc_complete_set.txt
output_dir: ../../output/ad_curated

datasets:
  # === Discovery — Brain Cortex ===

  # GSE33000 — Prefrontal cortex, Rosetta/Merck log-ratio array
  # REQUIRES FILTERING: remove Huntington's disease samples
  # NOTE: Log-ratio values centered near zero, NOT log2-intensities
  - id: GSE33000
    series_matrix: ../../data/geo/ad/GSE33000_AD_only_series_matrix.txt.gz
    platform: ../../data/platforms/GPL4372.annot
    role: discovery
    tissue: brain
    phenotype_field: Sample_characteristics_ch2
    case_values: ["disease status: alzheimer"]
    control_values: ["disease status: non-demented"]

  # GSE44770 — Prefrontal cortex, same Rosetta/Merck platform
  - id: GSE44770
    series_matrix: ../../data/geo/ad/GSE44770_series_matrix.txt.gz
    platform: ../../data/platforms/GPL4372.annot
    role: discovery
    tissue: brain
    phenotype_field: Sample_characteristics_ch2
    case_values: ["disease: a"]
    control_values: ["disease: n"]

  # GSE118553 — Temporal cortex, Illumina HumanHT-12 V4
  # REQUIRES FILTERING: extract temporal cortex samples only, exclude AsymAD
  - id: GSE118553
    series_matrix: ../../data/geo/ad/GSE118553_TC_series_matrix.txt.gz
    platform: ../../data/platforms/GPL10558.annot
    role: discovery
    tissue: brain
    phenotype_field: Sample_characteristics_ch1
    case_values: ["disease state: ad"]
    control_values: ["disease state: control"]

  # === Replication — Brain Cortex ===

  # GSE5281 — Superior frontal gyrus, Affymetrix HG-U133 Plus 2
  # REQUIRES FILTERING: extract SFG samples only
  - id: GSE5281
    series_matrix: ../../data/geo/ad/GSE5281_SFG_series_matrix.txt.gz
    platform: ../../data/platforms/GPL570.annot
    role: replication
    tissue: brain
    phenotype_field: Sample_characteristics_ch1
    case_values: ["disease state: alzheimer"]
    control_values: ["disease state: normal"]

  # GSE15222 — Cortical tissue, Sentrix HumanRef-8
  - id: GSE15222
    series_matrix: ../../data/geo/ad/GSE15222_series_matrix.txt.gz
    platform: ../../data/platforms/GPL2700.annot
    role: replication
    tissue: brain
    phenotype_field: Sample_source_name_ch1
    case_values: ["alzheimer"]
    control_values: ["normal"]

phase1:
  p_threshold: 0.05
  min_datasets: 2

phase3:
  n_neighbors: [10, 15, 30]
  seeds: [42, 123, 456, 789, 1024]
  min_cluster_size: 5
  min_samples: 3

phase4:
  n_permutations: 10000
  seed: 42
